[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adc-webkit"
version = "0.1.0"
description = "Async web framework toolkit based on Starlette"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["web", "async", "starlette", "api", "openapi", "jwt"]
authors = [
    { name = "ascet.dev" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "starlette>=0.47.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.11.7",
    "python-jose[cryptography]>=3.5.0",
    "ujson>=5.10.0",
    "swagger-ui-py",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ascet-dev/adc-webkit"
Repository = "https://github.com/ascet-dev/adc-webkit"
Issues = "https://github.com/ascet-dev/adc-webkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["adc_webkit"]
